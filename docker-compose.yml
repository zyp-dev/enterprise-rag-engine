# SkyWalking 全链路追踪：OAP 后端 + UI 前端（第二章）
# 启动：docker compose up -d    停止：docker compose down
services:
  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: skywalking-oap
    restart: unless-stopped  # Docker/电脑重启后自动恢复
    ports:
      - "11800:11800"   # gRPC：agent 上报数据走这里
      - "12800:12800"   # HTTP：GraphQL 查询接口
      - "9412:9412"     # HTTP：zipkin-lens UI（看 OTLP/zipkin 格式的 span）
    environment:
      - TZ=Asia/Shanghai
      # 开启 OTLP Trace 接收：默认只开 metrics/logs，不开 traces 会报
      # "Method not found: TraceService/Export"（Python 跨语言追踪必需）
      - SW_OTEL_RECEIVER_ENABLED_HANDLERS=otlp-metrics,otlp-logs,otlp-traces
      # OTLP Trace 在 9.7.0 内部转成 Zipkin 格式处理，zipkin 接收器也必须开
      - SW_RECEIVER_ZIPKIN=default
      # OTLP 的 Span 在 9.7.0 存进 zipkin 专用存储，要开 zipkin-lens UI 才能看到（端口 9412）
      - SW_QUERY_ZIPKIN=default

  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: skywalking-ui
    restart: unless-stopped  # Docker/电脑重启后自动恢复
    ports:
      - "18080:8080"    # UI 网页：浏览器访问 http://localhost:18080
    environment:
      - SW_OAP_ADDRESS=http://skywalking-oap:12800
      - TZ=Asia/Shanghai
    depends_on:
      - skywalking-oap

  # ===== 第三章：Prometheus 指标采集 + Grafana 可视化 =====
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"     # Prometheus 网页：http://localhost:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"     # Grafana 网页：http://localhost:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin   # 登录账号 admin / 密码 admin

  # ===== 项目7：Kafka 事件驱动（doc-service 发事件 → search-service 消费建索引）=====
  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"     # Kafka broker 地址：localhost:9092
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker   # KRaft 单节点（不依赖 ZooKeeper）
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true    # 课程简化：生产者发消息自动建 topic
      - ALLOW_PLAINTEXT_LISTENER=yes
