server:
  port: 8082

spring:
  application:
    name: doc-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/doc_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Kafka（项目7：事件驱动）
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# 项目7：文档索引事件主题（doc-service 发 → search-service 消费）
doc:
  kafka-topic: doc-indexed

# 熔断配置 (之前写的，保留即可)
resilience4j:
  circuitbreaker:
    instances:
      aiBreaker:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s