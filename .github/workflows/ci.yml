# CI/CD：每次 push / PR 自动构建；可扩展为构建镜像并推送到镜像仓库
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Maven 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 编译打包（跳过测试）
        run: mvn -B package -DskipTests

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: |
            gateway/target/*.jar
            ai-service/target/*.jar
            doc-service/target/*.jar
            search-service/target/*.jar

  # 可选：构建并推送 Docker 镜像（需在仓库 Settings → Secrets 配置 DOCKER_USERNAME / DOCKER_PASSWORD）
