# Service：网关暴露到集群外，其余服务集群内通信（经 Nacos 发现）
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: rag-engine
spec:
  type: NodePort   # 对外暴露（也可用 LoadBalancer / Ingress）
  selector: { app: gateway }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080   # 访问 http://<节点IP>:30080
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: rag-engine
spec:
  selector: { app: ai-service }
  ports: [{ port: 8081, targetPort: 8081 }]
---
apiVersion: v1
kind: Service
metadata:
  name: doc-service
  namespace: rag-engine
spec:
  selector: { app: doc-service }
  ports: [{ port: 8082, targetPort: 8082 }]
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: rag-engine
spec:
  selector: { app: search-service }
  ports: [{ port: 8083, targetPort: 8083 }]
---
apiVersion: v1
kind: Service
metadata:
  name: metric-service
  namespace: rag-engine
spec:
  selector: { app: metric-service }
  ports: [{ port: 8090, targetPort: 8090 }]
